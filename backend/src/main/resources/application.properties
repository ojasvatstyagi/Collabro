# APPLICATION CONFIGURATION
spring.application.name=backend
spring.profiles.active=dev
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# DATABASE CONFIGURATION
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# JPA/HIBERNATE CONFIG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# EMAIL CONFIGURATION (Shared properties)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000

# VALIDATION & SECURITY
spring.mvc.validate-on-binding=true
spring.mvc.throw-exception-if-no-handler-found=true

# FILE UPLOAD (Note: A better approach is to use absolute paths or a path relative to the app execution)
app.upload.base-path=src/main/resources/Uploads

# JWT TOKEN CONFIGURATION
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# REFRESH TOKEN COOKIE CONFIGURATION  
jwt.cookie.name=refreshToken
jwt.cookie.http-only=true
jwt.cookie.secure=false
jwt.cookie.same-site=Lax
jwt.cookie.max-age=604800
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173