# APPLICATION CONFIGURATION
spring.application.name=backend
spring.profiles.active=dev

# DATABASE CONFIGURATION
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# JPA/HIBERNATE CONFIG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# EMAIL CONFIGURATION (Shared properties)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000

# VALIDATION & SECURITY
spring.mvc.validate-on-binding=true
spring.mvc.throw-exception-if-no-handler-found=true

# FILE UPLOAD
app.upload.base-path=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# JWT TOKEN CONFIGURATION
# No default on purpose: the application refuses to start without a real secret
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# REFRESH TOKEN COOKIE CONFIGURATION  
jwt.cookie.name=refreshToken
jwt.cookie.http-only=true
jwt.cookie.secure=false
jwt.cookie.same-site=Lax
jwt.cookie.max-age=604800
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173