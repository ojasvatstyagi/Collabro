# Production profile (SPRING_PROFILES_ACTIVE=prod). Every secret comes from the environment; nothing has a default.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# The schema must already exist (hibernate refuses to start if it does not match the entities)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

jwt.cookie.secure=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.upload.base-path=${UPLOAD_DIR}
