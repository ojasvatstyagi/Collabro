# Production profile (SPRING_PROFILES_ACTIVE=prod). Every secret comes from the environment; nothing has a default.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Flyway owns the schema (db/migration). A database that predates Flyway (created by ddl-auto=update) is marked as
# already at version 1 instead of being re-created; an EMPTY database gets V1 applied. Hibernate then only validates.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# The schema must match the entities (hibernate refuses to start if it does not)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

jwt.cookie.secure=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.upload.base-path=${UPLOAD_DIR}
