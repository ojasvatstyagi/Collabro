# Development profile. Secrets come from the environment / backend/.env (see .env.example), never from this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/collabro}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Swagger UI and /v3/api-docs are open to anonymous visitors in development only (anywhere else they need a login)
app.docs.public=true

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
