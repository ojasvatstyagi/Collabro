# Test configuration: replaces the main application.properties on the test classpath,
# so tests never use the dev profile, the MySQL database or any real credentials.
spring.application.name=backend-test

spring.datasource.url=jdbc:h2:mem:collabro;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Tests build the H2 schema from the entities; the MySQL migrations are checked against a real MySQL (docs/AUDIT.md)
spring.flyway.enabled=false
spring.jpa.show-sql=false

# Dummy mail settings: the context only needs a JavaMailSender bean, nothing is sent
spring.mail.host=localhost
spring.mail.port=2525

# Throwaway key for tests only (HS256 needs at least 32 bytes)
jwt.secret=test-only-secret-key-not-used-anywhere-else-0123456789
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.cookie.name=refreshToken
jwt.cookie.max-age=604800

app.cors.allowed-origins=http://localhost:5173
app.upload.base-path=target/test-uploads
